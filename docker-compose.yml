services:
  botler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: botler
    restart: always
    expose:
      - 3000
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/db/custom.db
      # Required — compose refuses to start without it:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set (e.g. openssl rand -base64 48)}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-https://botler.help}
    volumes:
      - ./db:/app/db:rw
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.botler.rule=Host(`botler.help`)"
      - "traefik.http.routers.botler.entrypoints=websecure"
      - "traefik.http.routers.botler.tls=true"
      - "traefik.http.routers.botler.service=botler"
      - "traefik.http.services.botler.loadbalancer.server.port=3000"
    networks:
      - web_proxy

networks:
  web_proxy:
    external: true
