name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./prisma/ci.db"
      JWT_SECRET: "ci-secret-0123456789-0123456789-0123456789"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Fail if migrations are not in sync with schema
        run: npx prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Fail if API route files are untracked (ignore-rule regression guard)
        run: |
          missing=$(comm -23 <(find src/app/api -name route.ts | sort) <(git ls-files src/app/api | sort) || true)
          if [ -n "$missing" ]; then
            echo "Untracked API route files (check .gitignore patterns):"
            echo "$missing"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
